[project]
name = "satsaathi-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "celery==5.6.3",
    "redis==6.4.0",
    "satsaathi-core",
    "satsaathi-jobs",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.uv.sources]
satsaathi-core = { workspace = true }
satsaathi-jobs = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satsaathi_worker"]
