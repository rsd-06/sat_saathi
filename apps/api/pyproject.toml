[project]
name = "satsaathi-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "sse-starlette==3.4.11",
    "uvicorn[standard]>=0.34,<1",
    "pydantic==2.13.5",
    "pydantic-settings>=2.6,<3",
    "asyncpg>=0.30,<1",
    "redis==6.4.0",
    "httpx>=0.28,<1",
    "satsaathi-core",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.uv.sources]
satsaathi-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satsaathi_api"]
