[project]
name = "satsaathi-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[dependency-groups]
dev = [
    "ruff==0.16.8",
    "pyright>=1.1.400,<2",
]

[tool.uv.workspace]
members = ["python/core", "python/tools", "python/jobs", "apps/api", "apps/worker"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Alembic writes these; reformatting generated DDL only invites merge pain.
"python/core/migrations/versions/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
    "satsaathi_core",
    "satsaathi_tools",
    "satsaathi_jobs",
    "satsaathi_api",
    "satsaathi_worker",
]

[tool.pyright]
include = [
    "python/core/src",
    "python/tools/src",
    "python/jobs/src",
    "apps/api/src",
    "apps/worker/src",
]
pythonVersion = "3.12"
typeCheckingMode = "basic"
