[project]
name = "satsaathi-models"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# Deliberately dependency-free. Declaring and resolving a model is not the
# same as running one: the API needs to know what exists and whether its
# weights are present, and must not pull a deep-learning stack to find out.
# Runtimes (torch, transformers, onnxruntime) are optional extras installed
# on the worker that actually loads a model.
dependencies = [
    "pydantic==2.13.5",
]

[project.optional-dependencies]
torch = ["torch>=2.5,<3", "transformers>=4.46,<5"]
onnx = ["onnxruntime>=1.20,<2"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satsaathi_models"]
