[project]
name = "satsaathi-jobs"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "satsaathi-core",
    "satsaathi-tools",
]

[tool.uv.sources]
satsaathi-core = { workspace = true }
satsaathi-tools = { workspace = true }

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "aiosqlite>=0.20,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satsaathi_jobs"]
