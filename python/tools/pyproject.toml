[project]
name = "satsaathi-tools"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic==2.13.5",
    "satsaathi-core",
]

[tool.uv.sources]
satsaathi-core = { workspace = true }

[dependency-groups]
dev = ["pytest>=8,<9", "rasterio>=1.4,<2", "numpy>=2.1,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satsaathi_tools"]
