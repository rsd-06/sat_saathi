[project]
name = "satsaathi-inference"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# The package imports without torch: `doctor` has to be able to say "torch is
# missing" rather than crash, and the unit tests run in CI with no GPU stack.
# Everything that touches a GPU sits behind the `gpu` extra, installed only on
# the GPU worker.
dependencies = [
    "satsaathi-core",
    "satsaathi-models",
    "pillow>=11,<13",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.9,<3",
    # Qwen3-VL needs >= 4.57; the adapters were saved with peft 0.21.
    "transformers>=4.57.1,<5",
    "peft>=0.21,<0.22",
    "bitsandbytes>=0.45,<1",
    "accelerate>=1.0,<2",
]

[project.scripts]
satsaathi-models = "satsaathi_inference.cli:main"

[tool.uv.sources]
satsaathi-core = { workspace = true }
satsaathi-models = { workspace = true }

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satsaathi_inference"]
