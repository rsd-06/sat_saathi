[project]
name = "satsaathi-core"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic==2.13.5",
    "pydantic-settings>=2.6,<3",
    "rasterio>=1.4,<2",
    "numpy>=2.1,<3",
    "shapely>=2.0,<3",
    "pyproj>=3.6,<4",
    "sqlalchemy[asyncio]>=2.0,<3",
    "geoalchemy2>=0.15,<1",
    "alembic>=1.13,<2",
    "asyncpg>=0.30,<1",
    "psycopg[binary]>=3.2,<4",
    "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
# Only needed for the S3 storage backend; offline mode never installs it.
s3 = ["boto3>=1.35,<2"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satsaathi_core"]
