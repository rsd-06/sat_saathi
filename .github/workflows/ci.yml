name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.17"
      - run: uv python install 3.12
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      # Module form, not the generated `pyright` shim: the shim is an unsigned
      # .exe on Windows and gets blocked by Application Control policies.
      - run: uv run python -m pyright
      - run: uv run --package satsaathi-core pytest python/core/tests
      - run: uv run --package satsaathi-tools pytest python/tools/tests
      - run: uv run --package satsaathi-api pytest apps/api/tests
      - run: uv run --package satsaathi-worker pytest apps/worker/tests

  compose-health:
    runs-on: ubuntu-latest
    needs: [js, python]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f infra/compose/docker-compose.yml --profile core up --build -d
      # /api/v1/health returns HTTP 200 even when degraded, so assert on the
      # body: Phase 1's definition of done is all four checks passing.
      - run: |
          for i in $(seq 1 30); do
            body=$(curl -sf http://localhost:8000/api/v1/health || true)
            if echo "$body" | grep -q '"status":"ok"'; then
              echo "$body"
              exit 0
            fi
            sleep 2
          done
          echo "API health never reported status=ok. Last response: ${body:-<unreachable>}" >&2
          exit 1
      - if: failure()
        run: docker compose -f infra/compose/docker-compose.yml --profile core logs
      - if: always()
        run: docker compose -f infra/compose/docker-compose.yml --profile core down -v
